name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        # TODO: Add the [rag] extra when vector-store/index tests are enabled in CI.
        # Keep model downloads out of the regular unit-test job; mock the embedder there.
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check .
