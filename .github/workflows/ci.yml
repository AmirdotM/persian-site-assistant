name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        # Keep heavyweight embedding/model packages and CUDA runtimes out of CI.
        # Vector-store tests need NumPy, but do not need sentence-transformers or model weights.
        run: python -m pip install -e ".[dev,vector]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check .
